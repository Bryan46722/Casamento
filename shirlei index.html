<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmação de Presença - Casamento</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #fff7ef;
      margin: 0;
      padding: 0;
      text-align: center;
      color: #222;
    }

    h1 {
      margin-top: 40px;
      font-size: 2rem;
    }

    .pix-container {
      background: white;
      margin: 30px auto;
      padding: 30px;
      max-width: 320px;
      border-radius: 16px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.05);
    }

    .pix-container img {
      width: 180px;
      margin: 15px 0;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.05);
    }

    .pix-container button {
      background-color: #2e8b57;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 15px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }

    .pix-container button:hover {
      background-color: #256c45;
    }

    .confirm-section {
      margin-top: 30px;
    }

    input[type="text"] {
      padding: 10px;
      width: 80%;
      max-width: 280px;
      margin-bottom: 15px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    .confirmar-btn {
      background-color: #6d1d1d;
      color: white;
      border: none;
      padding: 10px 25px;
      font-size: 15px;
      border-radius: 8px;
      cursor: pointer;
    }

    .confirmar-btn:hover {
      background-color: #4a1414;
    }

    .local-btn {
      background-color: #0056d6;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 15px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
    }

    .local-btn:hover {
      background-color: #003f9a;
    }

    .contador {
      margin-top: 40px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Quer celebrar conosco este momento especial?</h1>

  <div class="pix-container">
    <p>Se desejar nos presentear com um gesto simbólico, aqui está nossa chave Pix — com carinho e gratidão ❤️</p>
    <img src="pix.png.jpg" alt="QR Code Pix" />
    <br />
    <button onclick="copiarChavePix()">Copiar chave Pix</button>
  </div>

  <p>Sua presença é o maior presente. Mas se desejar contribuir com carinho, agradecemos de coração.</p>

  <div class="confirm-section">
    <input type="text" id="nome" placeholder="Digite seu nome" />
    <br />
    <button class="confirmar-btn" onclick="confirmarPresenca()">Confirmar Presença</button>
    <p id="contador">Confirmados: 0</p>
    <button class="local-btn" onclick="verLocal()">Ver local da cerimônia</button>
  </div>

  <p class="contador" id="contadorDias"></p>

  <script>
    let contador = 0;

    function copiarChavePix() {
      const chave = "suachavepix@exemplo.com";
      navigator.clipboard.writeText(chave);
      alert("Chave Pix copiada com sucesso!");
    }

    function confirmarPresenca() {
      const nome = document.getElementById("nome").value.trim();
      if (nome === "") {
        alert("Por favor, digite seu nome.");
        return;
      }

      contador++;
      document.getElementById("contador").textContent = "Confirmados: " + contador;

      const numero = "12392462144"; // Sem 55
      const mensagem = `Olá! Estou confirmando presença no casamento. Meu nome é ${nome}.`;
      const url = `https://wa.me/${numero}?text=${encodeURIComponent(mensagem)}`;
      window.open(url, '_blank');
    }

    function verLocal() {
      window.open("https://www.google.com/maps/place/Artsul+Eventos,+Rua+Luiz+Maske,+1070+%E2%80%93+Itoupavazinha,+Blumenau/", "_blank");
    }

    function atualizarContadorDias() {
      const casamento = new Date("2025-11-15T18:00:00");
      const agora = new Date();
      const diff = casamento - agora;

      const dias = Math.floor(diff / (1000 * 60 * 60 * 24));
      const horas = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutos = Math.floor((diff / (1000 * 60)) % 60);

      document.getElementById("contadorDias").textContent = `Faltam ${dias} dias, ${horas} horas e ${minutos} minutos para o casamento.`;
    }

    atualizarContadorDias();
    setInterval(atualizarContadorDias, 60000);
  </script>
</body>
</html>
