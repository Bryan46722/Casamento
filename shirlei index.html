<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirmação de Presença - Casamento</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #fff7ef;
      color: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 20px;
    }

    .pix-container {
      background-color: white;
      border-radius: 16px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      padding: 20px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      margin-bottom: 20px;
    }

    .pix-container img {
      max-width: 150px;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    .pix-container p {
      font-size: 14px;
      margin-bottom: 10px;
    }

    .btn-copy {
      background-color: #2e8b57;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-copy:hover {
      background-color: #256f47;
    }

    .descricao {
      font-size: 14px;
      text-align: center;
      max-width: 400px;
      margin-bottom: 20px;
    }

    .input-nome {
      padding: 10px;
      width: 100%;
      max-width: 300px;
      border: 1px solid #ccc;
      border-radius: 5px;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .btn-confirmar {
      background-color: #7b1f1f;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 15px;
    }

    .btn-confirmar:hover {
      background-color: #5e1616;
    }

    .confirmados {
      font-size: 14px;
      margin-bottom: 20px;
    }

    .btn-maps {
      background-color: #1e90ff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      text-decoration: none;
      display: inline-block;
      margin-bottom: 20px;
    }

    .contador {
      font-weight: bold;
      font-size: 14px;
      text-align: center;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 1.2rem;
      }

      .pix-container img {
        max-width: 130px;
      }
    }
  </style>
</head>
<body>

  <h1>Quer celebrar conosco este momento especial?</h1>

  <div class="pix-container">
    <p>Se você quiser nos presentear com uma contribuição simbólica, aqui está nosso Pix:</p>
    <img src="pix.png" alt="QR Code Pix" />
    <br />
    <button class="btn-copy" onclick="copiarPix()">Copiar chave Pix</button>
  </div>

  <p class="descricao">
    Sua presença é o maior presente. Mas se desejar contribuir com carinho, agradecemos de coração.
  </p>

  <input class="input-nome" type="text" id="nome" placeholder="Digite seu nome" />
  <button class="btn-confirmar" onclick="confirmarPresenca()">Confirmar Presença</button>

  <div class="confirmados">Confirmados: <span id="contador">0</span></div>

  <a class="btn-maps" href="https://www.google.com/maps/place/Artsul+Eventos,+R.+Luiz+Maske,+1070+-+Itoupavazinha,+Blumenau+-+SC,+89066-050" target="_blank">
    Ver local da cerimônia
  </a>

  <p class="contador" id="contador-tempo"></p>

  <script>
    let confirmados = 0;

    function copiarPix() {
      navigator.clipboard.writeText("SUA-CHAVE-PIX-AQUI");
      alert("Chave Pix copiada!");
    }

    function confirmarPresenca() {
      const nome = document.getElementById("nome").value.trim();
      if (!nome) {
        alert("Por favor, digite seu nome.");
        return;
      }

      confirmados++;
      document.getElementById("contador").textContent = confirmados;

      const mensagem = encodeURIComponent(`Olá! Estou confirmando presença no casamento. Meu nome é: ${nome}`);
      const numero = "12392462144";
      window.open(`https://wa.me/${numero}?text=${mensagem}`, "_blank");
    }

    // Contagem regressiva
    const dataCasamento = new Date("2025-11-15T18:00:00");

    function atualizarContador() {
      const agora = new Date();
      const diferenca = dataCasamento - agora;

      if (diferenca <= 0) {
        document.getElementById("contador-tempo").textContent = "O grande dia chegou!";
        return;
      }

      const dias = Math.floor(diferenca / (1000 * 60 * 60 * 24));
      const horas = Math.floor((diferenca / (1000 * 60 * 60)) % 24);
      const minutos = Math.floor((diferenca / (1000 * 60)) % 60);

      document.getElementById("contador-tempo").textContent =
        `Faltam ${dias} dias, ${horas} horas e ${minutos} minutos para o casamento.`;
    }

    setInterval(atualizarContador, 1000);
    atualizarContador();
  </script>
</body>
</html>
